# Codex configuration

model = "gpt-6-sol"
model_reasoning_effort = "medium"
model_verbosity = "low"
web_search = "live"
personality = "none"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[features]
apps = false
fast_mode = true
memories = false
prevent_idle_sleep = true

[realtime]
voice = "arbor"

[tui]
fullscreen_transcript = false
show_tooltips = false
auto_recap = false
status_line = [
  "model-with-reasoning",
  "total-input-tokens",
  "total-output-tokens",
  "context-remaining",
  "estimated-thread-cost",
]
status_line_use_colors = true
screen_reader_detection_done = true

[sandbox_workspace_write]
network_access = true

[mcp_servers.grafana]
command = "uvx"
args = ["mcp-grafana"]
env_vars = ["GRAFANA_URL", "GRAFANA_SERVICE_ACCOUNT_TOKEN"]
startup_timeout_sec = 10
enabled_tools = [
  "generate_deeplink",
  "get_alert_group",
  "get_annotation_tags",
  "get_annotations",
  "get_assertions",
  "get_dashboard_by_uid",
  "get_dashboard_panel_queries",
  "get_dashboard_property",
  "get_dashboard_summary",
  "get_datasource",
  "get_doc",
  "get_panel_image",
  "list_alert_groups",
  "list_datasources",
  "list_prometheus_label_names",
  "list_prometheus_label_values",
  "list_prometheus_metric_metadata",
  "list_prometheus_metric_names",
  "query_prometheus",
  "query_prometheus_histogram",
  "search_dashboards",
  "search_docs",
  "search_folders",
]

[plugins."sharepoint@openai-curated-remote"]
enabled = false

[plugins."pages@openai-curated-remote"]
enabled = false

[plugins."work-pets@openai-curated-remote"]
enabled = false

[plugins."ponytail@ponytail"]
enabled = true

[marketplaces.ponytail]
source_type = "git"
source = "https://github.com/DietrichGebert/ponytail.git"
